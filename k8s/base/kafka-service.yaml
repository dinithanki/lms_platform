apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: lms
spec:
  ports:
    - name: kafka
      port: 29092
      targetPort: 29092
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kafka
  namespace: lms
  labels:
    kubernetes.io/service-name: kafka
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - name: kafka
    protocol: TCP
    port: 29092
endpoints:
  - addresses:
      - 172.20.0.2
    conditions:
      ready: true
