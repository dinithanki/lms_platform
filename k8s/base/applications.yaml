apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-profile-uploads
  namespace: lms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: lms
  labels:
    app.kubernetes.io/name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/dinithanki/lms_platform-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-external:5432/auth_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lms-app-secrets
                  key: LMS_DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lms-app-secrets
                  key: LMS_DB_PASSWORD
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: SPRING_FLYWAY_BASELINE_VERSION
              value: "1"
            - name: LMS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lms-app-secrets
                  key: LMS_JWT_SECRET
            - name: LMS_AUTH_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lms-app-secrets
                  key: LMS_AUTH_SERVICE_TOKEN
            - name: USER_SERVICE_URL
              value: http://user-service:8082
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: lms
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: lms
  labels:
    app.kubernetes.io/name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
    spec:
      containers:
        - name: user-service
          image: ghcr.io/dinithanki/lms_platform-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-external:5432/user_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lms-app-secrets
                  key: LMS_DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lms-app-secrets
                  key: LMS_DB_PASSWORD
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: SPRING_FLYWAY_BASELINE_VERSION
              value: "1"
            - name: LMS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lms-app-secrets
                  key: LMS_JWT_SECRET
            - name: LMS_AUTH_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lms-app-secrets
                  key: LMS_AUTH_SERVICE_TOKEN
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
            - name: KAFKA_CONSUMER_GROUP_ID
              value: lms-user-service
            - name: KAFKA_STUDENT_ENROLLED_TOPIC
              value: lms.course.student-enrolled
            - name: APP_UPLOAD_DIR
              value: /app/uploads/profile-pictures
          volumeMounts:
            - name: profile-uploads
              mountPath: /app/uploads/profile-pictures
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: profile-uploads
          persistentVolumeClaim:
            claimName: user-profile-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: lms
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
---
