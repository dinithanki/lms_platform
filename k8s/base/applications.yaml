apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: lms
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/dinithanki/lms_platform-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9080
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: LMS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lms-app-secrets
                  key: LMS_JWT_SECRET
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8081
            - name: USER_SERVICE_URL
              value: http://user-service:8082
            - name: COURSE_SERVICE_URL
              value: http://course-service:8083
            - name: QUIZ_SERVICE_URL
              value: http://quiz-service:8084
          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: lms
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-frontend
  namespace: lms
  labels:
    app.kubernetes.io/name: lms-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lms-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lms-frontend
    spec:
      containers:
        - name: lms-frontend
          image: ghcr.io/dinithanki/lms_platform-lms-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: lms-frontend
  namespace: lms
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: lms-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
