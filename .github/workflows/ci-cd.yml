name: LMS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            database: gateway_ci
          - service: auth-service
            database: auth_db
          - service: user-service
            database: user_db
          - service: course-service
            database: course_db
          - service: quiz-service
            database: quiz_db
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ${{ matrix.database }}
          POSTGRES_USER: lms_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.database }}
      SPRING_DATASOURCE_USERNAME: lms_ci
      SPRING_DATASOURCE_PASSWORD: ci-only-password
      LMS_JWT_SECRET: ci-only-jwt-secret-long-enough-for-tests-123456
      LMS_AUTH_SERVICE_TOKEN: ci-only-auth-service-token-for-tests
      LMS_QUIZ_SERVICE_TOKEN: ci-only-quiz-service-token-for-tests
      LMS_ADMIN_SEED_ENABLED: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Make Maven wrapper executable
        working-directory: ${{ matrix.service }}
        run: chmod +x ./mvnw

      - name: Run complete Maven test suite
        working-directory: ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress clean test

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lms-frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: lms-frontend
        run: npm ci

      - name: Build Vite frontend
        working-directory: lms-frontend
        run: npm run build

  docker-build:
    name: Build ${{ matrix.service }} image
    needs:
      - backend-tests
      - frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - course-service
          - quiz-service
          - lms-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          repository="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          owner="${repository%%/*}"
          repo="${repository#*/}"
          echo "name=ghcr.io/${owner}/${repo}-${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ steps.image.outputs.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish-images:
    name: Publish ${{ matrix.service }} to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-tests
      - frontend-build
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - course-service
          - quiz-service
          - lms-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          repository="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          owner="${repository%%/*}"
          repo="${repository#*/}"
          echo "name=ghcr.io/${owner}/${repo}-${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
