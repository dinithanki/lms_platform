name: LMS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_services:
        description: Comma-separated services to publish; empty publishes none
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            database: gateway_ci
          - service: auth-service
            database: auth_db
          - service: user-service
            database: user_db
          - service: course-service
            database: course_db
          - service: quiz-service
            database: quiz_db
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ${{ matrix.database }}
          POSTGRES_USER: lms_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.database }}
      SPRING_DATASOURCE_USERNAME: lms_ci
      SPRING_DATASOURCE_PASSWORD: ci-only-password
      LMS_JWT_SECRET: ci-only-jwt-secret-long-enough-for-tests-123456
      LMS_AUTH_SERVICE_TOKEN: ci-only-auth-service-token-for-tests
      LMS_QUIZ_SERVICE_TOKEN: ci-only-quiz-service-token-for-tests
      LMS_ADMIN_SEED_ENABLED: "false"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Make Maven wrapper executable
        working-directory: ${{ matrix.service }}
        run: chmod +x ./mvnw

      - name: Run complete Maven test suite
        working-directory: ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress clean test

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lms-frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: lms-frontend
        run: npm ci

      - name: Build Vite frontend
        working-directory: lms-frontend
        run: npm run build

  docker-build:
    name: Build ${{ matrix.service }} image
    needs:
      - backend-tests
      - frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - course-service
          - quiz-service
          - lms-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Derive image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          repository="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          owner="${repository%%/*}"
          repo="${repository#*/}"
          echo "name=ghcr.io/${owner}/${repo}-${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ steps.image.outputs.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  select-images:
    name: Select images to publish
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.select.outputs.publish }}
      services: ${{ steps.select.outputs.services }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: select
        name: Select changed or requested services
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          REQUESTED_SERVICES: ${{ inputs.publish_services }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          allowed = {
              "api-gateway",
              "auth-service",
              "user-service",
              "course-service",
              "quiz-service",
              "lms-frontend",
          }
          selected = set()

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              requested = os.environ.get("REQUESTED_SERVICES", "").strip()
              if requested:
                  selected = {
                      item.strip()
                      for item in requested.split(",")
                      if item.strip()
                  }
                  invalid = selected - allowed
                  if invalid:
                      print(
                          "Invalid service selection; use only the supported service names.",
                          file=sys.stderr,
                      )
                      sys.exit(1)
          elif os.environ["EVENT_NAME"] == "push":
              before = os.environ.get("BEFORE", "")
              if before and set(before) != {"0"}:
                  result = subprocess.run(
                      [
                          "git",
                          "diff",
                          "--name-only",
                          "--no-renames",
                          before,
                          os.environ["HEAD"],
                          "--",
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  for path in result.stdout.splitlines():
                      service = path.split("/", 1)[0]
                      if service in allowed:
                          selected.add(service)

          selected = sorted(selected)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={'true' if selected else 'false'}\n")
              output.write(
                  f"services={json.dumps(selected or ['auth-service'])}\n"
              )
          print(
              "Selected services: "
              + (", ".join(selected) if selected else "(none)")
          )
          PY

  publish-images:
    name: Publish ${{ matrix.service }} to GHCR
    if: >-
      needs.select-images.outputs.publish == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - backend-tests
      - frontend-build
      - docker-build
      - select-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select-images.outputs.services) }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Derive image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          repository="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          owner="${repository%%/*}"
          repo="${repository#*/}"
          echo "name=ghcr.io/${owner}/${repo}-${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
