New-Item -ItemType Directory -Force -Path .github | Out-Null

@'
version: 2

updates:
  # Java Spring Boot microservices
  - package-ecosystem: "maven"
    directory: "/api-gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/auth-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/user-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/course-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/quiz-service"
    schedule:
      interval: "weekly"

  # React frontend
  - package-ecosystem: "npm"
    directory: "/lms-frontend"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
'@ | Set-Content -Path .github/dependabot.yml -Encoding utf8