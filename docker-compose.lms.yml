name: lms-platform

services:
  lms-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${LMS_DB_USER:?Set LMS_DB_USER in .env}
      POSTGRES_PASSWORD: ${LMS_DB_PASSWORD:?Set LMS_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - lms_postgres_data:/var/lib/postgresql
      - ./infra/lms/postgres/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    networks:
      - lms-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  lms-db-restore:
    image: postgres:18
    profiles: ["restore"]
    environment:
      PGHOST: lms-postgres
      PGPORT: "5432"
      PGUSER: ${LMS_DB_USER:?Set LMS_DB_USER in .env}
      PGPASSWORD: ${LMS_DB_PASSWORD:?Set LMS_DB_PASSWORD in .env}
    volumes:
      - ./infra/lms/postgres/restore.sh:/restore.sh:ro
      - type: bind
        source: ${LMS_BACKUP_DIR:?Set LMS_BACKUP_DIR in .env}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
    networks:
      - lms-backend
    depends_on:
      lms-postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/restore.sh"]

  kafka-ready:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    networks:
      - kafka
    healthcheck:
      test: ["CMD-SHELL", "nc -z kafka 29092"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    image: lms-auth-service:local
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://lms-postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${LMS_DB_USER:?Set LMS_DB_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${LMS_DB_PASSWORD:?Set LMS_DB_PASSWORD in .env}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
      LMS_JWT_SECRET: ${LMS_JWT_SECRET:?Set LMS_JWT_SECRET in .env}
      LMS_AUTH_SERVICE_TOKEN: ${LMS_AUTH_SERVICE_TOKEN:?Set LMS_AUTH_SERVICE_TOKEN in .env}
      USER_SERVICE_URL: http://user-service:8082
    expose:
      - "8081"
    networks:
      - lms-backend
    depends_on:
      lms-postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
    image: lms-user-service:local
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://lms-postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${LMS_DB_USER:?Set LMS_DB_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${LMS_DB_PASSWORD:?Set LMS_DB_PASSWORD in .env}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
      LMS_JWT_SECRET: ${LMS_JWT_SECRET:?Set LMS_JWT_SECRET in .env}
      LMS_AUTH_SERVICE_TOKEN: ${LMS_AUTH_SERVICE_TOKEN:?Set LMS_AUTH_SERVICE_TOKEN in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP_ID: lms-user-service
      KAFKA_STUDENT_ENROLLED_TOPIC: lms.course.student-enrolled
      APP_UPLOAD_DIR: /app/uploads/profile-pictures
    expose:
      - "8082"
    volumes:
      - lms_user_uploads:/app/uploads
    networks:
      - lms-backend
      - kafka
    depends_on:
      lms-postgres:
        condition: service_healthy
      kafka-ready:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8082/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  course-service:
    build:
      context: ./course-service
    image: lms-course-service:local
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://lms-postgres:5432/course_db
      SPRING_DATASOURCE_USERNAME: ${LMS_DB_USER:?Set LMS_DB_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${LMS_DB_PASSWORD:?Set LMS_DB_PASSWORD in .env}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
      LMS_JWT_SECRET: ${LMS_JWT_SECRET:?Set LMS_JWT_SECRET in .env}
      LMS_QUIZ_SERVICE_TOKEN: ${LMS_QUIZ_SERVICE_TOKEN:?Set LMS_QUIZ_SERVICE_TOKEN in .env}
      USER_SERVICE_URL: http://user-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    expose:
      - "8083"
    networks:
      - lms-backend
      - kafka
    depends_on:
      lms-postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      kafka-ready:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8083/courses >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  quiz-service:
    build:
      context: ./quiz-service
    image: lms-quiz-service:local
    environment:
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://lms-postgres:5432/quiz_db
      SPRING_DATASOURCE_USERNAME: ${LMS_DB_USER:?Set LMS_DB_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${LMS_DB_PASSWORD:?Set LMS_DB_PASSWORD in .env}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
      LMS_JWT_SECRET: ${LMS_JWT_SECRET:?Set LMS_JWT_SECRET in .env}
      LMS_QUIZ_SERVICE_TOKEN: ${LMS_QUIZ_SERVICE_TOKEN:?Set LMS_QUIZ_SERVICE_TOKEN in .env}
      COURSE_SERVICE_URL: http://course-service:8083
    expose:
      - "8084"
    networks:
      - lms-backend
    depends_on:
      lms-postgres:
        condition: service_healthy
      course-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8084/actuator/health | grep -Eq '^(200|403)$'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    image: lms-api-gateway:local
    environment:
      SERVER_PORT: "8080"
      LMS_JWT_SECRET: ${LMS_JWT_SECRET:?Set LMS_JWT_SECRET in .env}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      COURSE_SERVICE_URL: http://course-service:8083
      QUIZ_SERVICE_URL: http://quiz-service:8084
    ports:
      - "${LMS_GATEWAY_PORT:-8085}:8080"
    networks:
      - lms-backend
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  lms-frontend:
    build:
      context: ./lms-frontend
      args:
        VITE_API_BASE_URL: ""
    image: lms-frontend:local
    ports:
      - "${LMS_FRONTEND_PORT:-3001}:80"
    networks:
      - lms-backend
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

networks:
  lms-backend:
    name: lms-platform-backend
    driver: bridge
  kafka:
    name: kafka_default
    external: true

volumes:
  lms_postgres_data:
    name: lms-platform-postgres-data
  lms_user_uploads:
    name: lms-platform-user-uploads
