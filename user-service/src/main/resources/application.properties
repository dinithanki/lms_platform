spring.application.name=user-service

server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# JWT Properties
jwt.secret=${LMS_JWT_SECRET:}
jwt.expiration=86400000
app.auth-service.token=${LMS_AUTH_SERVICE_TOKEN:}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# File Upload Directory
app.upload.dir=uploads/profile-pictures

# Kafka consumer for course enrollment activity events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:lms-user-service}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.lms.userservice.dto.event.StudentEnrolledEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.lms.userservice.dto.event
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.listener.ack-mode=record
app.kafka.topics.student-enrolled=${KAFKA_STUDENT_ENROLLED_TOPIC:lms.course.student-enrolled}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
