server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          # Optional Filter:
          # filters:
          #   - StripPrefix=1

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**
          # Optional Filter:
          # filters:
          #   - StripPrefix=1

        - id: course-service
          uri: ${COURSE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/courses/**, /api/modules/**, /api/students/**, /api/certificates/**
          filters:
            - StripPrefix=1

        - id: quiz-service
          uri: ${QUIZ_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/quizzes/**, /api/questions/**
          filters:
            - StripPrefix=1

# Log levels for debugging microservice calls through the gateway
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.http.server.reactive: INFO
    org.springframework.web.reactive: INFO
    reactor.netty: INFO
    com.lms.apigateway: DEBUG

jwt:
  secret: ${LMS_JWT_SECRET:}

management:
  server:
    port: 9080
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
